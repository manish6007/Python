# Builds the downloadable app for Windows, macOS and Linux.
#
# The point of this project is that the data never leaves the machine it is
# on, so there is no server to deploy — the deliverable is a file a person
# downloads and runs. PyInstaller can only build for the platform it runs
# on, hence one job per operating system.
name: portfolio-tracker release

on:
  push:
    tags: ['portfolio-tracker-v*']
  workflow_dispatch:          # so a build can be made without tagging

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: PortfolioTracker-windows
            binary: dist/PortfolioTracker.exe
          - os: macos-latest
            artifact: PortfolioTracker-macos
            binary: dist/PortfolioTracker
          - os: ubuntu-latest
            artifact: PortfolioTracker-linux
            binary: dist/PortfolioTracker
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: portfolio-tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: portfolio-tracker/frontend/package-lock.json
      - name: Build the frontend
        working-directory: portfolio-tracker/frontend
        run: npm ci && npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: portfolio-tracker/backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt pyinstaller

      - name: Build the application
        run: pyinstaller --clean --noconfirm portfolio-tracker.spec

      # A build that starts, serves, and stops. Catches the failure this
      # packaging is most prone to: a module PyInstaller could not see, which
      # only shows up at runtime and only in the bundle.
      - name: Check that it runs
        shell: bash
        run: |
          "${{ matrix.binary }}" --no-browser &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8765/api/summary > /dev/null; then
              echo "the built app serves the API"
              curl -sf http://127.0.0.1:8765/ > /dev/null \
                && echo "and the frontend"
              exit 0
            fi
            sleep 1
          done
          echo "the built app never started"; exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: portfolio-tracker/${{ matrix.binary }}
          if-no-files-found: error
